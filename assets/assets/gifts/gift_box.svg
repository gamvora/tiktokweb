<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
  </defs>
  <g filter="drop-shadow(1px 3px 4px rgba(0,0,0,0.3))">
    <!-- Box body -->
    <rect x="12" y="38" width="56" height="34" rx="3" fill="url(#boxGrad)"/>
    <!-- Lid -->
    <rect x="8" y="30" width="64" height="12" rx="3" fill="url(#lidGrad)"/>
    <!-- Horizontal ribbon -->
    <rect x="12" y="44" width="56" height="8" fill="url(#ribbonGrad)" opacity="0.9"/>
    <!-- Vertical ribbon -->
    <rect x="36" y="30" width="8" height="42" rx="1" fill="url(#ribbonGrad)" opacity="0.9"/>
    <!-- Bow - left loop -->
    <path d="M40 30 Q28 18 22 22 Q18 26 26 30 L40 30Z" fill="#ffd54f" stroke="#ffb300" stroke-width="0.5"/>
    <!-- Bow - right loop -->
    <path d="M40 30 Q52 18 58 22 Q62 26 54 30 L40 30Z" fill="#ffd54f" stroke="#ffb300" stroke-width="0.5"/>
    <!-- Bow center knot -->
    <circle cx="40" cy="30" r="4" fill="#ffb300"/>
    <circle cx="40" cy="30" r="2.5" fill="#ffc107" opacity="0.7"/>
    <!-- Box shine -->
    <rect x="14" y="40" width="6" height="30" rx="2" fill="white" opacity="0.1"/>
  </g>
</svg>
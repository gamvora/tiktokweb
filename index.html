<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=public/index.html">
  <title>🎡 روليت تيك توك لايف</title>
  <script>
    // Immediate redirect to overlay game screen
    window.location.replace("public/index.html");
  </script>
  <style>
    body {
      background: #0b0d19;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #141729;
      border: 1px solid #232742;
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      color: #fe2c55;
      margin-bottom: 10px;
    }
    a.btn {
      display: inline-block;
      margin: 10px;
      padding: 12px 24px;
      background: linear-gradient(45deg, #fe2c55, #ff0050);
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      transition: transform 0.2s;
    }
    a.btn-sec {
      background: #25f4ee;
      color: #000;
    }
    a.btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

  <div class="card">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="dinoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <radialGradient id="dinoBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8e6c9"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </radialGradient>
  </defs>
  <g filter="drop-shadow(1px 2px 3px rgba(0,0,0,0.25))">
    <!-- Body -->
    <ellipse cx="38" cy="48" rx="20" ry="16" fill="url(#dinoGrad)"/>
    <!-- Belly -->
    <ellipse cx="36" cy="50" rx="12" ry="10" fill="url(#dinoBelly)"/>
    <!-- Tail -->
    <path d="M56 48 Q68 44 72 34 Q70 36 66 38 Q68 30 65 28" fill="url(#dinoGrad)" stroke="#2e7d32" stroke-width="1"/>
    <!-- Head -->
    <ellipse cx="22" cy="30" rx="14" ry="12" fill="url(#dinoGrad)"/>
    <!-- Snout -->
    <ellipse cx="13" cy="32" rx="7" ry="6" fill="#66bb6a"/>
    <!-- Eye -->
    <circle cx="18" cy="27" r="4" fill="white"/>
    <circle cx="17" cy="27" r="2.5" fill="#1a1a1a"/>
    <circle cx="16" cy="26" r="1" fill="white"/>
    <!-- Nostril -->
    <circle cx="9" cy="31" r="1" fill="#2e7d32"/>
    <!-- Mouth -->
    <path d="M8 35 Q13 38 18 35" stroke="#2e7d32" stroke-width="1" fill="none"/>
    <!-- Spikes -->
    <path d="M28 20 L30 12 L34 20" fill="#4caf50"/>
    <path d="M34 19 L37 10 L41 20" fill="#43a047"/>
    <path d="M40 22 L44 14 L47 24" fill="#388e3c"/>
    <!-- Legs -->
    <rect x="26" y="60" width="6" height="10" rx="3" fill="url(#dinoGrad)"/>
    <rect x="42" y="60" width="6" height="10" rx="3" fill="url(#dinoGrad)"/>
    <!-- Feet -->
    <ellipse cx="29" cy="71" rx="5" ry="3" fill="#2e7d32"/>
    <ellipse cx="45" cy="71" rx="5" ry="3" fill="#2e7d32"/>
    <!-- Arm -->
    <path d="M24 42 Q18 48 20 52" stroke="url(#dinoGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
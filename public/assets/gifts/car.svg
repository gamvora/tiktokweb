<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="carShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="windowGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbdefb"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
  </defs>
  <g filter="drop-shadow(1px 2px 3px rgba(0,0,0,0.3))">
    <!-- Car body lower -->
    <path d="M6 48 L6 56 Q6 60 10 60 L70 60 Q74 60 74 56 L74 48 Q74 44 70 44 L10 44 Q6 44 6 48Z" fill="url(#carBody)"/>
    <!-- Car body upper / cabin -->
    <path d="M18 44 L24 28 Q26 24 30 24 L50 24 Q54 24 56 28 L62 44" fill="url(#carBody)"/>
    <!-- Shine -->
    <path d="M18 44 L24 28 Q26 24 30 24 L50 24 Q54 24 56 28 L62 44" fill="url(#carShine)"/>
    <!-- Windshield -->
    <path d="M26 42 L30 28 Q31 26 34 26 L38 26 L38 42Z" fill="url(#windowGradC)" opacity="0.8"/>
    <!-- Rear window -->
    <path d="M54 42 L50 28 Q49 26 46 26 L42 26 L42 42Z" fill="url(#windowGradC)" opacity="0.8"/>
    <!-- Headlights -->
    <ellipse cx="10" cy="50" rx="3" ry="2.5" fill="#fff9c4"/>
    <ellipse cx="10" cy="50" rx="2" ry="1.5" fill="white" opacity="0.8"/>
    <!-- Taillights -->
    <ellipse cx="70" cy="50" rx="3" ry="2.5" fill="#ff8a80"/>
    <!-- Front wheel -->
    <circle cx="20" cy="62" r="7" fill="#37474f"/>
    <circle cx="20" cy="62" r="4" fill="#78909c"/>
    <circle cx="20" cy="62" r="2" fill="#546e7a"/>
    <!-- Rear wheel -->
    <circle cx="60" cy="62" r="7" fill="#37474f"/>
    <circle cx="60" cy="62" r="4" fill="#78909c"/>
    <circle cx="60" cy="62" r="2" fill="#546e7a"/>
    <!-- Body line -->
    <line x1="10" y1="52" x2="70" y2="52" stroke="#c62828" stroke-width="0.8" opacity="0.5"/>
  </g>
</svg>
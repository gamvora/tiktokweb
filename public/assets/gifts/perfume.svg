<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e1bee7"/>
      <stop offset="50%" stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>
    <linearGradient id="bottleShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="capGradP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </linearGradient>
  </defs>
  <g filter="drop-shadow(1px 2px 3px rgba(0,0,0,0.3))">
    <!-- Spray nozzle -->
    <rect x="38" y="8" width="4" height="6" rx="1" fill="#bdbdbd"/>
    <!-- Cap -->
    <rect x="32" y="14" width="16" height="8" rx="3" fill="url(#capGradP)"/>
    <!-- Neck -->
    <rect x="36" y="22" width="8" height="8" rx="1" fill="#e1bee7"/>
    <!-- Body -->
    <rect x="22" y="30" width="36" height="40" rx="6" fill="url(#bottleGrad)"/>
    <!-- Shine -->
    <rect x="26" y="32" width="8" height="36" rx="4" fill="url(#bottleShine)"/>
    <!-- Label area -->
    <rect x="28" y="42" width="24" height="16" rx="3" fill="rgba(255,255,255,0.15)"/>
    <!-- Sparkles -->
    <circle cx="35" cy="47" r="1" fill="white" opacity="0.6"/>
    <circle cx="45" cy="52" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="40" cy="44" r="0.6" fill="white" opacity="0.4"/>
  </g>
</svg>
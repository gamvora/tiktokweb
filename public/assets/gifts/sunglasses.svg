<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="40%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="lensShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
  </defs>
  <g filter="drop-shadow(1px 2px 3px rgba(0,0,0,0.3))">
    <!-- Left arm -->
    <path d="M3 32 L15 36" stroke="url(#frameGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Right arm -->
    <path d="M77 32 L65 36" stroke="url(#frameGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <!-- Bridge -->
    <path d="M33 38 Q40 44 47 38" stroke="url(#frameGrad)" stroke-width="2.5" fill="none"/>
    <!-- Left lens -->
    <rect x="10" y="32" width="24" height="18" rx="6" fill="url(#lensGrad)" stroke="#222" stroke-width="2"/>
    <rect x="10" y="32" width="24" height="18" rx="6" fill="url(#lensShine)"/>
    <!-- Right lens -->
    <rect x="46" y="32" width="24" height="18" rx="6" fill="url(#lensGrad)" stroke="#222" stroke-width="2"/>
    <rect x="46" y="32" width="24" height="18" rx="6" fill="url(#lensShine)"/>
  </g>
</svg>